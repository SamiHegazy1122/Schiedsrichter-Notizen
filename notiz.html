<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notizen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Neue Notiz</h1>

    <label>Tore Heim</label>
    <input type="number" id="tore-heim" min="0" value="0">
    <label>Tore Auswärts</label>
    <input type="number" id="tore-auswaerts" min="0" value="0">
    <label>Eigentore</label>
    <input type="number" id="eigentore" min="0" value="0">
    <label>Gelbe Karten</label>
    <input type="number" id="gelbe-karten" min="0" value="0">
    <label>Rote Karten</label>
    <input type="number" id="rote-karten" min="0" value="0">
    <label>Geschehnisse</label>
    <input type="text" id="geschehnisse" placeholder=" Diskussionen">

    <h3> Text/Notiz zum Spiel</h3>
    <textarea id ="Notiz-text" placeholder=" Deine Notizen zum Spiel"> </textarea>
    <button id="btn-speichern"> Speichern</button>
    <button id="btn-leeren">Notiz leeren </button>

    <script src="script.js"></script>
    
    
</body>
</html>
